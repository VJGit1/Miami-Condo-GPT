terms:
  - term: holding period
    definition: >
      Days between consecutive sales of the same unit. Compute per unit by
      ordering sales by closing_date and differencing adjacent closings.
  - term: approved
    definition: >
      core_condobuilding.approved = TRUE. Always filter to approved buildings
      unless the user explicitly asks for unapproved inventory.
  - term: blacklist
    definition: >
      Exclude condosales where blacklist = TRUE and condounits where blacklist = TRUE.
  - term: Miami-Dade market
    definition: >
      Exclude buildings whose core_condomarket.name = 'Miami-Dade'.
  - term: South of Fifth
    definition: >
      SoFi micro-market in South Beach; filter addresses near 5th Street south
      or subdivision containing 'South of Fifth'.
  - term: sales volume
    definition: >
      SUM(sale_price) for non-blacklisted sales matching the query scope
      (building, market, or time window).
  - term: Collins Avenue
    definition: >
      Filter core_condobuilding.address ILIKE '%collins%' (also match 'collins ave').
  - term: Brickell
    definition: >
      Market name or address area; join core_condomarket where name ILIKE '%Brickell%'
      or use search_proper_nouns for fuzzy building names.
  - term: unit number
    definition: core_condounit.unit_no identifies a unit within a building.
  - term: closing date
    definition: core_condosale.closing_date is the sale close; use for time filters.
  - term: sale price
    definition: core_condosale.sale_price integer USD; exclude blacklist = TRUE.
  - term: building alt_name
    definition: >
      Human-friendly building name in core_condobuilding.alt_name; always show
      address alongside alt_name in answers.
  - term: join path
    definition: >
      core_condosale.condo_unit_id -> core_condounit.id;
      core_condounit.building_id -> core_condobuilding.id;
      core_condobuilding.market_id -> core_condomarket.id.
  - term: average sale price
    definition: AVG(sale_price) over filtered non-blacklisted sales.
  - term: South Beach
    definition: Miami Beach market area; often filtered via market name or address.
