<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <title>CondoGPT</title>

    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #343541;
        color: #d1d5db;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
      }
      .container {
        width: 100%;
        max-width: 800px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        padding: 20px;
      }
      h1 {
        color: #fff;
        margin-bottom: 20px;
        text-align: center;
      }
      form {
        display: flex;
        margin-bottom: 20px;
      }
      input[type="text"] {
        flex-grow: 1;
        padding: 15px;
        border: 1px solid #555;
        background-color: #40414f;
        color: #d1d5db;
        border-radius: 5px;
        font-size: 16px;
        margin-right: 10px;
      }
      input[type="submit"] {
        padding: 15px 20px;
        background-color: #10a37f;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }
      input[type="submit"]:hover {
        background-color: #0e8d6d;
      }
      .result,
      .conversation-history {
        background-color: #40414f;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        color: #d1d5db;
      }
      .result h2,
      .conversation-history h2 {
        margin-top: 0;
        color: #fff;
      }
      .conversation-entry {
        margin-bottom: 10px;
      }
      .conversation-entry p {
        margin: 5px 0;
      }
      .conversation-entry .question {
        color: #10a37f;
        font-weight: bold;
      }
      .markdown-content {
        padding: 10px;
        background-color: #2b2c34;
        border-radius: 5px;
      }
      pre {
        background-color: #2b2c34;
        padding: 15px;
        overflow-x: auto;
        border-radius: 5px;
        color: #d1d5db;
      }
      .result-block {
        margin-bottom: 16px;
      }
      #map {
        height: 400px;
        width: 100%;
      }
      .voice-controls {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 20px;
      }
      .voice-controls button {
        padding: 15px 20px;
        background-color: #10a37f;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }
      .voice-controls button:disabled {
        background-color: #555;
        cursor: default;
      }
      #voice-status {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        src="{{ url_for('static', filename='images/logo.webp') }}"
        style="margin: 0 auto; border-radius: 50%; shadow: 0 0 10px #000"
        alt="CondoGPT Logo"
        width="200"
        height="200"
      />
      <h1>CondoGPT</h1>
      <form id="question-form" method="POST">
        <input
          id="question-input"
          type="text"
          name="question"
          placeholder="Enter your question here"
          required
        />
        <input type="submit" value="Submit" />
      </form>
      <div class="voice-controls">
        <button type="button" id="voice-talk">Talk</button>
        <button type="button" id="voice-stop" disabled>Stop</button>
        <span id="voice-status" aria-live="polite"></span>
      </div>
      {% if result %}
      <div class="result">
        <h2>Result:</h2>
        {% for res in result %}
        <div class="result-block">{{ res }}</div>
        {% endfor %}
      </div>
      {% endif %}
      {% if include_map %}
      <script src="https://maps.googleapis.com/maps/api/js?key={{ gmaps_api_key }}"></script>
      <script>
        function initMap() {
          var el = document.getElementById("map");
          if (!el || !window.google || !google.maps) return;
          var markers = [];
          try {
            markers = JSON.parse(el.getAttribute("data-markers") || "[]");
          } catch (error) {
            return;
          }
          var first = markers[0] || { lat: 25.79, lng: -80.13 };
          var map = new google.maps.Map(el, {
            zoom: 13,
            center: { lat: Number(first.lat), lng: Number(first.lng) },
          });
          var bounds = new google.maps.LatLngBounds();
          markers.forEach(function (marker) {
            var position = { lat: Number(marker.lat), lng: Number(marker.lng) };
            var title = [marker.name, marker.address].filter(Boolean).join(" - ");
            new google.maps.Marker({
              position: position,
              map: map,
              title: title,
            });
            bounds.extend(position);
          });
          if (markers.length > 1) {
            map.fitBounds(bounds);
          } else if (markers.length === 1) {
            map.setCenter(bounds.getCenter());
            map.setZoom(15);
          }
        }
        initMap();
      </script>
      {% endif %}
      {% if conversation_history %}
      <div class="conversation-history">
        <h2>Conversation History:</h2>
        {% for entry in conversation_history %}
        <div class="conversation-entry">
          <p class="question">Q: {{ entry.question }}</p>
          <div class="markdown-content">
            <p>A: {{ entry.answer }}</p>
          </div>
        </div>
        {% endfor %}
      </div>
      {% endif %}
      <form method="POST">
        <input type="hidden" name="sign_out" value="true" />
        <input type="submit" value="Clear Memory" />
      </form>
    </div>
    <script>
      (function () {
        var VOICE_KEY = "condo_voice";
        var talkButton = document.getElementById("voice-talk");
        var stopButton = document.getElementById("voice-stop");
        var statusNode = document.getElementById("voice-status");
        var questionForm = document.getElementById("question-form");
        var questionInput = document.getElementById("question-input");
        var recorder = null;
        var chunks = [];
        var stream = null;
        var playing = null;
        var recording = false;

        function setStatus(text) {
          statusNode.textContent = text || "";
        }

        function voiceEnabled() {
          return sessionStorage.getItem(VOICE_KEY) === "1";
        }

        function resultSpeechText() {
          var result = document.querySelector(".result");
          if (!result) return "";
          var clone = result.cloneNode(true);
          clone.querySelectorAll("script, style, #map").forEach(function (node) {
            node.remove();
          });
          return (clone.innerText || "").replace(/\s+/g, " ").trim();
        }

        function encodeWav(audioBuffer) {
          var samples = audioBuffer.getChannelData(0);
          var buffer = new ArrayBuffer(44 + samples.length * 2);
          var view = new DataView(buffer);
          function writeString(offset, value) {
            for (var i = 0; i < value.length; i++) view.setUint8(offset + i, value.charCodeAt(i));
          }
          writeString(0, "RIFF");
          view.setUint32(4, 36 + samples.length * 2, true);
          writeString(8, "WAVE");
          writeString(12, "fmt ");
          view.setUint32(16, 16, true);
          view.setUint16(20, 1, true);
          view.setUint16(22, 1, true);
          view.setUint32(24, audioBuffer.sampleRate, true);
          view.setUint32(28, audioBuffer.sampleRate * 2, true);
          view.setUint16(32, 2, true);
          view.setUint16(34, 16, true);
          writeString(36, "data");
          view.setUint32(40, samples.length * 2, true);
          var offset = 44;
          for (var index = 0; index < samples.length; index++, offset += 2) {
            var sample = Math.max(-1, Math.min(1, samples[index]));
            view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
          }
          return new Blob([buffer], { type: "audio/wav" });
        }

        function blobToWav(blob) {
          return blob.arrayBuffer().then(function (bytes) {
            var context = new AudioContext();
            return context.decodeAudioData(bytes).then(function (audioBuffer) {
              context.close();
              return encodeWav(audioBuffer);
            });
          });
        }

        function startRecording() {
          if (!navigator.mediaDevices || !window.MediaRecorder) {
            setStatus("Voice input needs a browser that can record audio.");
            return;
          }
          setStatus("Listening");
          navigator.mediaDevices.getUserMedia({ audio: true }).then(function (userStream) {
            if (!voiceEnabled()) {
              userStream.getTracks().forEach(function (track) { track.stop(); });
              return;
            }
            stream = userStream;
            chunks = [];
            var mimeType = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
            recorder = mimeType ? new MediaRecorder(userStream, { mimeType: mimeType }) : new MediaRecorder(userStream);
            recorder.ondataavailable = function (event) {
              if (event.data && event.data.size) chunks.push(event.data);
            };
            recorder.onstop = submitRecording;
            recorder.start();
            recording = true;
            talkButton.textContent = "Send";
            stopButton.disabled = false;
          }).catch(function () {
            sessionStorage.removeItem(VOICE_KEY);
            setStatus("Microphone permission was denied.");
            talkButton.textContent = "Talk";
            stopButton.disabled = true;
          });
        }

        function submitRecording() {
          recording = false;
          talkButton.textContent = "Talk";
          if (stream) stream.getTracks().forEach(function (track) { track.stop(); });
          if (!voiceEnabled()) return;
          var blob = new Blob(chunks, { type: recorder && recorder.mimeType ? recorder.mimeType : "audio/webm" });
          setStatus("Looking that up");
          blobToWav(blob).then(function (wav) {
            var body = new FormData();
            body.append("audio", wav, "question.wav");
            return fetch("/voice/transcribe", { method: "POST", body: body });
          }).then(function (response) {
            return response.json().then(function (payload) {
              if (!response.ok) throw new Error(payload.error || "Transcription failed.");
              return payload.text || "";
            });
          }).then(function (text) {
            if (!voiceEnabled()) return;
            if (!text.trim()) {
              setStatus("I didn't catch that.");
              startRecording();
              return;
            }
            questionInput.value = text.trim();
            setStatus("Looking that up");
            questionForm.submit();
          }).catch(function (error) {
            setStatus(error.message || "Transcription failed.");
          });
        }

        function playAnswer() {
          var text = resultSpeechText();
          if (!text || !voiceEnabled()) {
            if (voiceEnabled()) startRecording();
            return;
          }
          setStatus("Looking that up");
          fetch("/voice/speak", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text }),
          }).then(function (response) {
            if (!response.ok) {
              return response.json().then(function (payload) {
                throw new Error(payload.error || "Speech failed.");
              });
            }
            return response.blob();
          }).then(function (audioBlob) {
            if (!voiceEnabled()) return;
            playing = new Audio(URL.createObjectURL(audioBlob));
            playing.onended = function () {
              if (voiceEnabled()) startRecording();
            };
            return playing.play();
          }).catch(function (error) {
            setStatus(error.message || "Speech failed.");
            if (voiceEnabled()) startRecording();
          });
        }

        talkButton.addEventListener("click", function () {
          sessionStorage.setItem(VOICE_KEY, "1");
          stopButton.disabled = false;
          if (recording && recorder && recorder.state === "recording") {
            recorder.stop();
            return;
          }
          startRecording();
        });

        stopButton.addEventListener("click", function () {
          sessionStorage.removeItem(VOICE_KEY);
          if (recorder && recorder.state === "recording") recorder.stop();
          if (stream) stream.getTracks().forEach(function (track) { track.stop(); });
          if (playing) {
            playing.pause();
            playing = null;
          }
          recording = false;
          talkButton.textContent = "Talk";
          stopButton.disabled = true;
          setStatus("");
        });

        var clearForm = document.querySelector("form input[name='sign_out']");
        if (clearForm && clearForm.form) {
          clearForm.form.addEventListener("submit", function () {
            sessionStorage.removeItem(VOICE_KEY);
          });
        }

        if (voiceEnabled() && document.querySelector(".result")) {
          playAnswer();
        }
      })();
    </script>
  </body>
</html>
